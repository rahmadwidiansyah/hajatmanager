services:
  postgres:
    image: postgres:16-alpine
    container_name: pencatat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pencatat_kondangan
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # tidak expose port ke host — hanya bisa diakses via network internal oleh service web

  web:
    # Production: GHCR image (pull tanpa build)
    # Lokal build: tetap bisa `docker compose build` karena ada `build: .`
    build: .
    image: ghcr.io/rahmadwidiansyah/hajatmanager:latest
    container_name: pencatat-web
    restart: unless-stopped
    ports:
      - "5080:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # override DATABASE_URL agar web di dalam docker bisa resolve hostname postgres via network internal
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pencatat_kondangan?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # JANGAN tambahkan volumes bind-mount di production!
    # volumes dev hanya di docker-compose.override.yml

networks:
  appnet:
    driver: bridge

volumes:
  pgdata:
