[package]
name = "hajat-manager"
version = "1.0.2"
edition = "2021"
description = "Hajat Manager — Windows native via Tauri (offline SQLite + 30m background sync + PIN 6 digit)"
authors = ["Hajat Manager"]
license = "MIT"
repository = "https://github.com/rahmadwidiansyah/hajatmanager/app"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri = { version = "2.3", features = [] }
tauri-plugin-sql = "2.2"
tauri-plugin-store = "2.2"
tauri-plugin-os = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
