name: Release (semantic-release)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Guard lapis-1: skip commit chore(release) agar tidak loop tak berujung.
    if: |
      !startsWith(github.event.head_commit.message, 'chore(release)')
    steps:
      # PENTING: push tag harus memakai PAT (RELEASE_PAT), bukan GITHUB_TOKEN.
      # Push/tag via GITHUB_TOKEN tidak memicu workflow lain (aturan GitHub),
      # sehingga Release Assets tidak akan jalan tanpa PAT ini.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cek RELEASE_PAT
        run: |
          if [ -z "${{ secrets.RELEASE_PAT }}" ]; then
            echo "::error::RELEASE_PAT belum diisi — push/tag via GITHUB_TOKEN TIDAK memicu workflow aset (aturan GitHub). Isi Settings → Secrets → RELEASE_PAT (PAT classic, scope repo+workflow). Lihat docs/release.md."
            exit 1
          else
            echo "RELEASE_PAT terisi ✓"
          fi

      # Guard lapis-2: jalankan semantic-release dalam mode dry-run dulu
      # untuk mengetahui versi yang akan dirilis tanpa benar-benar commit/tag.
      # Jika versi itu sudah ada sebagai tag di remote → skip.
      - name: Cek apakah rilis baru diperlukan
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          # Dry-run: semantic-release print nextRelease.version tanpa push apa-apa
          OUTPUT=$(npx semantic-release --dry-run --no-ci 2>&1 || true)
          echo "--- dry-run: $(echo "$OUTPUT" | wc -l) baris output ---"
          echo "$OUTPUT" | tail -20

          # Ekstrak versi yang akan dirilis (case-insensitive + fallback
          # tanpa -P, karena -P bisa tidak tersedia / gagal diam-diam)
          NEXT_VERSION=$(echo "$OUTPUT" | grep -oiP '(?<=the next release version is )\S+' | head -1 || true)
          if [ -z "$NEXT_VERSION" ]; then
            NEXT_VERSION=$(echo "$OUTPUT" | grep -oiE 'the next release version is [^ ]+' | head -1 | awk '{print $NF}' || true)
          fi
          if [ -z "$NEXT_VERSION" ]; then
            echo "--- diagnostik: cari petunjuk versi/error ---"
            echo "$OUTPUT" | grep -iE 'next release|no relevant|EGIT|error|✘' | head -10 || true
          fi

          if [ -z "$NEXT_VERSION" ]; then
            # Semantic-release tidak menemukan commit releasable → tidak ada rilis baru
            echo "Tidak ada rilis baru yang perlu dibuat, skip."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Versi berikutnya: $NEXT_VERSION"

          # Cek apakah tag itu sudah ada di remote
          if git ls-remote --tags origin "refs/tags/v${NEXT_VERSION}" | grep -q "v${NEXT_VERSION}"; then
            echo "::warning::Tag v${NEXT_VERSION} sudah ada di remote — skip semantic-release untuk mencegah crash."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag v${NEXT_VERSION} belum ada → lanjutkan release."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: semantic-release
        if: steps.check_release.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: npx semantic-release
