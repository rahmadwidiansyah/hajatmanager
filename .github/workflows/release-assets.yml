name: Release Assets (Windows C# + APK)

# Satu-satunya workflow yang build saat tag v* dibuat.
# semantic-release (release.yml) membuat tag -> workflow ini build semua
# artifact paralel -> job publish melampirkan SEMUANYA ke 1 release.
# Jangan pernah attach rilis dari workflow lain agar tidak balapan.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.0.3) — kosong = dari tag/package.json"
        required: false
        default: ""

# Rilis jangan pernah di-cancel otomatis.
concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            REF="${GITHUB_REF_NAME:-}"
            case "$REF" in v*) V="${REF#v}" ;; esac
          fi
          if [ -z "$V" ]; then V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=v$V" >> $GITHUB_OUTPUT
          echo "release version=$V tag=v$V"

  build-windows-csharp:
    # Windows kini C# WPF (windows/), bukan Flutter. APK tetap Flutter.
    needs: resolve
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: XAML lint (Color-as-Brush guard)
        shell: pwsh
        run: python scripts/check-wpf-brushes.py
        # Catatan: windows-latest sudah menyertakan python3/python.
        # Gagal di sini = ada Background/Foreground/BorderBrush yang
        # memakai <Color> (contoh: SurfaceContainer) bukan <Brush>
        # (SurfaceContainerBrush) — dulu menyebabkan crash
        # "'#FF1E2A3A' is not valid value for Background" di EventDetailWindow.

      - name: Restore + Build (Release)
        working-directory: windows/src/HajatManager
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      # Windows hanya Setup.exe self-contained (tanpa .NET).
      # Varian ZIP portable framework-dependent dihapus total (sering gagal
      # jalan karena butuh .NET Desktop Runtime yang tepat).
      - name: Publish self-contained (untuk Setup.exe)
        working-directory: windows/src/HajatManager
        run: >
          dotnet publish -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.resolve.outputs.version }}
          -o publish-setup

      - name: Ensure release dir
        shell: pwsh
        working-directory: windows
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem src/HajatManager/publish-setup/ | Select-Object Name, Length
          Get-ChildItem release/

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile Setup.exe
        shell: pwsh
        working-directory: windows/installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ needs.resolve.outputs.version }}" `
            hajat-manager.iss
          Get-ChildItem ..\release\*.exe

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: hajat-manager-windows-setup
          path: windows/release/*.exe
          if-no-files-found: error

  build-flutter-apk:
    # APK dari Flutter (mobile/).
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # Satu string, tanpa kutip dalam (kutip ikut terkirim ke sdkmanager).
          packages: 'platform-tools build-tools;34.0.0 build-tools;35.0.0 build-tools;36.0.0 platforms;android-34 platforms;android-35 platforms;android-36'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-flutter-${{ hashFiles('mobile/android/settings.gradle.kts', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-flutter-

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Keystore rilis (bila secrets ada)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "no keystore secrets -> APK debug-signed (installable)"; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/app/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF
          echo "keystore + key.properties written"

      - name: Build APK (release)
        working-directory: mobile
        run: flutter build apk --release --build-name=${{ needs.resolve.outputs.version }} --build-number=${{ github.run_number }}

      - name: Collect APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p release
          APK=$(find mobile/build/app/outputs -name "app-release.apk" | head -n 1)
          echo "apk: $APK"
          if [ -z "$APK" ]; then echo "::error::app-release.apk tidak ditemukan"; exit 1; fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            cp "$APK" "release/Hajat-Manager-${{ needs.resolve.outputs.version }}.apk"
          else
            cp "$APK" "release/Hajat-Manager-${{ needs.resolve.outputs.version }}-unsigned.apk"
          fi
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hajat-manager-flutter-apk
          path: release/*.apk
          if-no-files-found: error

  build-flutter-linux:
    # Flutter desktop Linux (Arch/CachyOS): tarball + AppImage.
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: mobile
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Linux (release)
        working-directory: mobile
        run: flutter build linux --release --build-name=${{ needs.resolve.outputs.version }} --build-number=${{ github.run_number }}

      - name: Collect tarball + AppImage
        run: |
          mkdir -p release-linux stage
          V="${{ needs.resolve.outputs.version }}"
          cp -r mobile/build/linux/x64/release/bundle stage/bundle
          cp packaging/linux/hajat-manager.desktop stage/
          cp mobile/assets/app_icon.png stage/hajat-manager.png
          tar -czf "release-linux/Hajat-Manager-$V-linux-x64.tar.gz" -C stage bundle hajat-manager.desktop hajat-manager.png
          bash packaging/linux/build-appimage.sh \
            mobile/build/linux/x64/release/bundle \
            packaging/linux/hajat-manager.desktop \
            mobile/assets/app_icon.png \
            "release-linux/Hajat-Manager-$V-linux-x64.AppImage"
          sha256sum release-linux/* > release-linux/SHA256SUMS.txt
          ls -lh release-linux/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hajat-manager-linux
          path: release-linux/*
          if-no-files-found: error

  build-flutter-windows:
    # Flutter desktop Windows (mobile/): ZIP portable hajat_manager.exe.
    # Berdampingan dengan Setup.exe C# — user pilih runtime (C#) atau Flutter.
    # Aman: workmanager hanya di-Android (guard di configureBackgroundSync),
    # SQLite via FFI, Google login desktop via browser.
    needs: resolve
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: mobile
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows (release)
        working-directory: mobile
        run: flutter build windows --release --build-name=${{ needs.resolve.outputs.version }} --build-number=${{ github.run_number }}

      - name: Collect portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          $Zip = "release-windows/Hajat-Manager-${{ needs.resolve.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path mobile/build/windows/x64/runner/Release/* -DestinationPath $Zip -Force
          $Hash = (Get-FileHash $Zip -Algorithm SHA256).Hash.ToLower()
          "$Hash  $(Split-Path $Zip -Leaf)" | Out-File release-windows/SHA256SUMS-windows.txt -Encoding ascii
          Get-ChildItem release-windows/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hajat-manager-windows-flutter
          path: release-windows/*
          if-no-files-found: error

  publish:
    needs: [resolve, build-windows-csharp, build-flutter-apk, build-flutter-linux, build-flutter-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List files
        run: ls -lh release/

      - name: Attach to GitHub Release (sekali, anti-balapan)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG ada (dari semantic-release) -> upload file"
            gh release upload "$TAG" release/* --clobber
          else
            echo "release $TAG belum ada (tag manual) -> buat baru"
            gh release create "$TAG" release/* --title "$TAG" --generate-notes
          fi
