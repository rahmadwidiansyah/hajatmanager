name: Windows EXE (Tauri)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.1.0) — kosong = dari package.json"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/windows/package-lock.json
            native/android/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/windows/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/windows/src-tauri/Cargo.lock') }}

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install windows deps
        working-directory: native/windows
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=v$V" >> $GITHUB_OUTPUT

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          AUTH_SECRET: dummy-32-chars-for-build-only-xxxxxxxxxxxxxxxx
        run: npx prisma generate

      - name: Build Tauri NSIS
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          AUTH_SECRET: dummy-32-chars-for-build-only-xxxxxxxxxxxxxxxx
        working-directory: native/windows
        run: npm run tauri:build

      - name: Collect EXE
        shell: bash
        run: |
          mkdir -p release
          cp native/windows/src-tauri/target/release/bundle/nsis/*.exe release/ 2>/dev/null || cp native/windows/src-tauri/target/release/bundle/**/*.exe release/ 2>/dev/null || true
          ls -lh release/ || true
          # rename to Hajat-Manager consistent name
          for f in release/*.exe; do [ -f "$f" ] && mv "$f" "release/Hajat-Manager-${{ steps.ver.outputs.version }}-x64-setup.exe" && break; done
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hajat-manager-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
