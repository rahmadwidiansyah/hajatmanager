name: Fix Tag (pindah tag ke HEAD main)

# Workflow satu kali pakai: pindahkan tag yang salah (orphan/diverge) ke HEAD main.
# Jalankan manual via Actions → "Fix Tag" → Run workflow.
# Setelah sukses, hapus workflow ini agar tidak disalahgunakan.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag yang akan dipindah (misal: v1.9.3)"
        required: true
        default: "v1.9.3"
      confirm:
        description: "Ketik 'yes' untuk konfirmasi (operasi destruktif: hapus + buat ulang tag)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  fix-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validasi konfirmasi
        run: |
          if [ "${{ inputs.confirm }}" != "yes" ]; then
            echo "::error::Konfirmasi tidak valid. Ketik 'yes' di field confirm."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Pindahkan tag ke HEAD
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          HEAD_SHA=$(git rev-parse HEAD)
          echo "HEAD: $HEAD_SHA"

          # Cek tag lama
          OLD_SHA=$(git rev-list -n 1 "$TAG" 2>/dev/null || echo "")
          if [ -z "$OLD_SHA" ]; then
            echo "Tag $TAG tidak ditemukan di remote, buat baru saja"
          else
            echo "Tag $TAG saat ini → $OLD_SHA"
            echo "Hapus tag lama dari remote..."
            git push origin ":refs/tags/$TAG"
          fi

          echo "Buat tag $TAG di HEAD ($HEAD_SHA)..."
          git tag -f "$TAG" "$HEAD_SHA"
          git push origin "refs/tags/$TAG"

          echo "✓ Tag $TAG sekarang menunjuk ke $HEAD_SHA"
          echo ""
          echo "Verifikasi:"
          git ls-remote origin "refs/tags/$TAG"

      - name: Summary
        run: |
          echo "## Fix Tag Selesai" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tag **${{ inputs.tag }}** berhasil dipindahkan ke HEAD \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Setelah ini, hapus file \`.github/workflows/fix-tag.yml\` dari repo." >> $GITHUB_STEP_SUMMARY
