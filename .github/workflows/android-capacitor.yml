name: Android APK (Capacitor — manual only)

# MANUAL SAJA (workflow_dispatch). Build tag resmi ditangani
# .github/workflows/release-assets.yml agar 1 rilis tidak balapan attach.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.1.0)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/windows/package-lock.json
            native/android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # Default action (tools) sudah obsolete → sdkmanager exit 1.
          packages: platform-tools "build-tools;34.0.0" "platforms;android-34"

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install android deps
        working-directory: native/android
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=v$V" >> $GITHUB_OUTPUT

      - name: Build web (static export for WebView)
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          AUTH_SECRET: dummy-32-chars-for-build-only-xxxxxxxxxxxxxxxx
        run: |
          npx prisma generate || true
          bash scripts/build-native.sh
          ls -lh out 2>&1 | head -n 20

      - name: Capacitor sync (add android if missing)
        working-directory: native/android
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew not found -> running cap add android"
            npx cap add android
          fi
          npx cap sync
          ls -la android 2>&1 | head -n 30
          ls -lh android/gradlew 2>&1 | head
          ls -lh android/app/build.gradle 2>&1 | head

      - name: Fix APK signing (fallback debug, local installable)
        run: bash scripts/fix-android-signing.sh

      - name: Patch build.gradle for dual signing (unsigned + signed)
        run: |
          GRADLE="native/android/android/app/build.gradle"
          if ! grep -q "keystoreProperties" "$GRADLE"; then
            echo "Patching $GRADLE for keystore.properties..."
            cat > /tmp/patch.py <<'PY'
          import pathlib
          p = pathlib.Path("native/android/android/app/build.gradle")
          s = p.read_text()
          if "keystoreProperties" not in s:
              s = s.replace(
                  "android {",
                  "def keystorePropertiesFile = rootProject.file(\"app/keystore.properties\")\n"
                  "def keystoreProperties = new Properties()\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
                  "android {"
              )
              s = s.replace(
                  "    buildTypes {\n        release {\n            minifyEnabled false",
                  "    signingConfigs {\n        release {\n            if (keystorePropertiesFile.exists()) {\n"
                  "                keyAlias keystoreProperties['keyAlias']\n"
                  "                keyPassword keystoreProperties['keyPassword']\n"
                  "                storeFile file(keystoreProperties['storeFile'])\n"
                  "                storePassword keystoreProperties['storePassword']\n"
                  "                v1SigningEnabled true\n"
                  "                v2SigningEnabled true\n"
                  "            }\n        }\n    }\n    buildTypes {\n        release {\n            minifyEnabled false"
              )
              s = s.replace(
                  "            minifyEnabled false\n            proguardFiles",
                  "            minifyEnabled false\n            proguardFiles"
              )
              # inject signingConfig dengan fallback debug agar APK lokal tetap signed (tidak "tidak valid")
              # Gunakan rootProject.file langsung untuk hindari MissingPropertyException di closure BuildType
              if "signingConfig signingConfigs.release" not in s:
                  s = s.replace(
                      "            minifyEnabled false",
                      "            minifyEnabled false\n            signingConfig rootProject.file(\"app/keystore.properties\").exists() ? signingConfigs.release : signingConfigs.debug"
                  )
              # ensure v1/v2 ada jika sudah ada signingConfigs tapi belum ada v1SigningEnabled
              if "v1SigningEnabled" not in s and "keystoreProperties" in s:
                  s = s.replace(
                      "                storePassword keystoreProperties['storePassword']",
                      "                storePassword keystoreProperties['storePassword']\n                v1SigningEnabled true\n                v2SigningEnabled true"
                  )
              # upgrade legacy conditional to fallback debug (ganti variabel dengan direct file check)
              if "if (keystorePropertiesFile.exists()) {\n                signingConfig" in s:
                  s = s.replace(
                      "            if (keystorePropertiesFile.exists()) {\n                signingConfig signingConfigs.release\n            }",
                      "            signingConfig rootProject.file(\"app/keystore.properties\").exists() ? signingConfigs.release : signingConfigs.debug"
                  )
              if "signingConfig keystorePropertiesFile.exists()" in s:
                  s = s.replace(
                      "signingConfig keystorePropertiesFile.exists()",
                      "signingConfig rootProject.file(\"app/keystore.properties\").exists()"
                  )
              p.write_text(s)
              print("patched")
          else:
              print("already patched")
          PY
            python3 /tmp/patch.py
            cat "$GRADLE" | head -n 80
          else
            echo "already patched"
          fi

      - name: Make gradlew executable
        run: |
          chmod +x native/android/android/gradlew 2>&1 || chmod +x native/android/gradlew 2>&1 || true
          ls -lh native/android/android/gradlew native/android/gradlew 2>&1 | head

      - name: Build APK (unsigned)
        working-directory: native/android
        run: |
          if [ -f "android/gradlew" ]; then
            bash android/gradlew -p android assembleRelease --stacktrace || bash android/gradlew -p android assembleRelease
          elif [ -f "gradlew" ]; then
            bash ./gradlew assembleRelease --stacktrace || bash ./gradlew assembleRelease
          else
            echo "gradlew not found at android/gradlew or gradlew"
            find . -name "gradlew*" -type f 2>&1 | head -n 20
            ls -R 2>&1 | head -n 100
            exit 1
          fi
          ls -lh android/app/build/outputs/apk/release/ 2>&1 | head -n 20 || ls -lh app/build/outputs/apk/release/ 2>&1 | head -n 20

      - name: Collect unsigned APK
        run: |
          mkdir -p release
          UAPK=$(find native/android -name "*.apk" -path "*release*" | head -n 1)
          echo "unsigned apk: $UAPK"
          if [ -n "$UAPK" ]; then cp "$UAPK" "release/Hajat-Manager-${{ steps.ver.outputs.version }}-unsigned.apk"; fi
          ls -lh release/ || true

      - name: Build APK (signed) — if keystore secrets present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: native/android
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "no keystore secrets, skip signed build"; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          # Rebuild signed (fallback debug already patched, now with release keystore)
          if [ -f "android/gradlew" ]; then
            bash android/gradlew -p android assembleRelease --stacktrace || bash android/gradlew -p android assembleRelease
          else
            bash ./gradlew assembleRelease --stacktrace || bash ./gradlew assembleRelease
          fi
          ls -lh android/app/build/outputs/apk/release/ 2>&1 | head -n 20 || ls -lh app/build/outputs/apk/release/ 2>&1 | head -n 20

      - name: Collect signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "no keystore, skip collect signed"; ls -lh release/ || true; exit 0; fi
          SAPK=$(find native/android -name "*.apk" -path "*release*" | head -n 1)
          echo "signed apk: $SAPK"
          if [ -n "$SAPK" ]; then cp "$SAPK" "release/Hajat-Manager-${{ steps.ver.outputs.version }}.apk"; fi
          ls -lh release/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hajat-manager-android
          path: release/*.apk
          if-no-files-found: warn
