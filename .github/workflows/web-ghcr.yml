name: Web GHCR (Docker)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: web-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build per-arch di runner NATIVE (tanpa emulasi QEMU) — paralel.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Versi web ngikutin semantic-release: bila trigger tag v* pakai tag
      # itu; bila manual (workflow_dispatch) pakai package.json.
      - name: Resolve version
        id: ver
        run: |
          REF="${GITHUB_REF_NAME:-}"
          case "$REF" in
            v*) V="${REF#v}" ;;
            *) V=$(node -p "require('./package.json').version") ;;
          esac
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "web version=$V"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: mode=min
          sbom: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/hajatmanager,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
            NEXT_PUBLIC_APP_VERSION=${{ steps.ver.outputs.version }}
            NEXT_PUBLIC_GITHUB_REPO=${{ github.repository }}
            NEXT_PUBLIC_DOWNLOAD_ANDROID=${{ vars.NEXT_PUBLIC_DOWNLOAD_ANDROID }}
            NEXT_PUBLIC_DOWNLOAD_WINDOWS=${{ vars.NEXT_PUBLIC_DOWNLOAD_WINDOWS }}
            NEXT_PUBLIC_DOWNLOAD_LINUX=${{ vars.NEXT_PUBLIC_DOWNLOAD_LINUX }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Gabung 2 digest jadi 1 manifest multi-arch dengan tag rilis.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/hajatmanager
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/hajatmanager@sha256:%s ' *)
